aid: '1919'
name: '1919'
description: '1919 (壹玖壹玖 / 1919酒类直供) is a Chengdu-based Chinese alcoholic-beverage retail
  and supply-chain platform operated by Sichuan 1919 Wines & Spirits SCM Co., Ltd. Founded
  in 2006, it runs an omnichannel online-to-offline model: the 1919吃喝 consumer app and a
  third-party e-commerce matrix layered on more than 3,000 franchised stores across 1,000+
  Chinese cities, marketed on a 19-minute rapid-delivery promise, alongside a B2B liquor
  supply-chain business selling order management, logistics and data-marketing services to
  distributors. The company listed on China''s NEEQ board in 2014 (830993), took a RMB 2
  billion strategic investment from Alibaba in 2018, and delisted from NEEQ in 2023; its
  shares now change hands on private secondary marketplaces.'
